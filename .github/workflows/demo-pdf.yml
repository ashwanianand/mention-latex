name: Build demo PDF

on:
  push:
    branches:
      - main
    paths:
      - mention.sty
      - targeted-comments-demo.tex
      - .github/workflows/demo-pdf.yml
  pull_request:
    paths:
      - mention.sty
      - targeted-comments-demo.tex
      - .github/workflows/demo-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Compile demo
        uses: xu-cheng/latex-action@v3
        with:
          root_file: targeted-comments-demo.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Upload demo PDF
        uses: actions/upload-artifact@v4
        with:
          name: targeted-comments-demo
          path: targeted-comments-demo.pdf
          if-no-files-found: error

      - name: Publish stable demo PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view demo-pdf >/dev/null 2>&1; then
            gh release upload demo-pdf targeted-comments-demo.pdf --clobber
          else
            gh release create demo-pdf targeted-comments-demo.pdf \
              --title "Latest compiled demo PDF" \
              --notes "Automatically built from targeted-comments-demo.tex on main." \
              --prerelease
          fi
